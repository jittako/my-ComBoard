<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b59">
    <title>ことばボード | AAC</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="brand-mark" aria-hidden="true">こ</div>
            <div>
                <p class="eyebrow">AAC COMMUNICATION</p>
                <h1>ことばボード</h1>
            </div>
            <div class="voice-status" id="voice-status" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                <span id="voice-status-text">音声を準備しています</span>
            </div>
            <button class="header-settings" id="open-settings" type="button" aria-label="設定をひらく" title="設定">
                <span aria-hidden="true">⚙</span><span class="header-settings-label">設定</span>
            </button>
        </div>
    </header>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-heading">
        <div class="settings-content">
            <div class="settings-header">
                <div>
                    <p class="eyebrow settings-eyebrow">AAC SETTINGS</p>
                    <h2 id="settings-heading">設定</h2>
                </div>
                <button class="settings-close" id="close-settings" type="button" aria-label="設定をとじる">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <section class="settings-section" aria-labelledby="playback-settings-heading">
                <h3 id="playback-settings-heading">ことばの再生方法</h3>
                <div class="mode-switch" role="group" aria-label="ことばの再生方法">
                    <button class="mode-button" type="button" data-mode="compose" aria-pressed="true">文をつくる</button>
                    <button class="mode-button" type="button" data-mode="direct" aria-pressed="false">一つずつ再生</button>
                </div>
            </section>
            <section class="settings-section" aria-labelledby="add-word-heading">
                <h3 id="add-word-heading">ことばを追加</h3>
                <p class="settings-note">追加したことばは、この端末のブラウザーに保存されます。</p>
                <form class="add-word-form" id="add-word-form">
                    <div class="add-word-fields">
                        <label>
                            ことば
                            <input id="word-label" name="label" type="text" maxlength="24" autocomplete="off" required placeholder="例：おなかがすいた">
                        </label>
                        <label>
                            カテゴリー
                            <select id="word-category" name="category" required></select>
                        </label>
                        <label>
                            マーク
                            <select id="word-emoji" name="emoji">
                                <option value="💬">💬 おはなし</option>
                                <option value="⭐">⭐ すき</option>
                                <option value="🍽️">🍽️ たべもの</option>
                                <option value="🎨">🎨 あそび</option>
                                <option value="🚶">🚶 いどう</option>
                                <option value="❗">❗ そのほか</option>
                            </select>
                        </label>
                    </div>
                    <div class="add-word-actions">
                        <button class="action-button speak-button" id="save-word-button" type="submit">追加して保存</button>
                        <button class="action-button secondary" id="cancel-edit-word" type="button" hidden>編集をやめる</button>
                    </div>
                    <p class="save-feedback" id="save-feedback" role="status" aria-live="polite"></p>
                </form>
            </section>
            <section class="settings-section" aria-labelledby="custom-words-heading">
                <h3 id="custom-words-heading">登録したことば</h3>
                <ul class="custom-word-list" id="custom-word-list" aria-label="追加したことば"></ul>
                <p class="custom-word-empty" id="custom-word-empty">追加したことばはまだありません。</p>
            </section>
        </div>
    </dialog>

    <main class="app-main">
        <section class="message-section" aria-labelledby="message-heading">
            <div class="section-heading">
                <h2 id="message-heading">つたえたいこと</h2>
                <span class="message-count" id="message-count">0こ</span>
            </div>
            <div class="message-board" id="message-board" aria-live="polite" aria-relevant="additions text">
                <p class="message-placeholder" id="message-placeholder">ことばをえらぶと、ここにならびます</p>
            </div>
            <div class="message-actions">
                <button class="action-button secondary" id="undo-button" type="button" disabled aria-label="さいごのことばをひとつもどす">
                    <span aria-hidden="true">↶</span> ひとつもどす
                </button>
                <button class="action-button secondary clear-button" id="clear-button" type="button" disabled>
                    <span aria-hidden="true">×</span> ぜんぶけす
                </button>
                <button class="action-button speak-button" id="speak-button" type="button" disabled>
                    <span aria-hidden="true">▶</span> つたえる
                </button>
            </div>
        </section>

        <section class="vocabulary-section" aria-labelledby="vocabulary-heading">
            <div class="section-heading vocabulary-heading">
                <h2 id="vocabulary-heading">ことばをえらぶ</h2>
                <span class="tap-hint" id="mode-hint">えらんだことばをつなげて再生できます</span>
            </div>
            <div class="category-list" id="category-list" role="group" aria-label="ことばのカテゴリー"></div>
            <div class="word-grid" id="word-grid" aria-live="polite"></div>
        </section>
    </main>

    <footer class="app-footer">ことばは、あなたのペースで。</footer>
</body>
</html>
